[project]
name = "stock-akshare-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "akshare==1.18.94",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
