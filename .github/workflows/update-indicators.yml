name: Update valuations and yields

on:
  schedule:
    # ChinaBond publishes after 17:30 Beijing time.
    - cron: '15 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-h30269
  cancel-in-progress: false

jobs:
  update-indicators:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: python -m pip install -r scripts/requirements-indicators.txt
      - name: Fetch valuations, CSI dividend and ChinaBond yield
        id: update
        continue-on-error: true
        run: npm run data:refresh-indicators
      - name: Fetch CSI constituents
        id: constituents
        continue-on-error: true
        run: python scripts/fetch-constituents.py
      - name: Fetch ETF cash distributions and splits
        id: etf_distributions
        continue-on-error: true
        run: npm run data:etf-distributions
      - name: Fetch ETF published NAV history
        id: etf_nav
        continue-on-error: true
        run: npm run data:etf-nav
      - name: Fetch constituent annual dividends and fundamentals
        id: fundamentals
        continue-on-error: true
        run: npm run data:fundamentals
      - name: Commit successful updates
        shell: bash
        run: |
          for path in public/data/dividend-h30269.json public/data/valuation-h30269.json public/data/valuation-history-h30269.json public/data/valuation-history-csi-h30269.json public/data/valuation-csi-status-h30269.json public/data/china-bond-10y.json public/data/yield-history-h30269-cn10y.json public/data/latest-metrics-h30269.json public/data/latest-metrics-source-status.json public/data/dashboard-source-status.json public/data/constituents-h30269.json public/data/constituents-history-h30269.json public/data/distributions-512890.json public/data/nav-512890.json public/data/fundamentals-h30269.json; do
            if [[ -f "$path" ]]; then git add -- "$path"; fi
          done
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update valuations and treasury yield"
          git push
      - name: Check trading calendar coverage
        if: always()
        id: calendar
        continue-on-error: true
        run: npm run calendar:check

      - name: Report incomplete update
        if: always() && (steps.update.outcome == 'failure' || steps.constituents.outcome == 'failure' || steps.etf_distributions.outcome == 'failure' || steps.etf_nav.outcome == 'failure' || steps.fundamentals.outcome == 'failure' || steps.calendar.outcome == 'failure')
        run: exit 1
