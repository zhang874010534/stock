name: Update valuations and yields

on:
  schedule:
    # ChinaBond publishes after 17:30 Beijing time.
    - cron: '15 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-h30269
  cancel-in-progress: false

jobs:
  update-indicators:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-indicators.txt
      - name: Fetch valuations, CSI dividend and ChinaBond yield
        id: update
        continue-on-error: true
        run: python scripts/fetch-indicators.py
      - name: Commit successful updates
        shell: bash
        run: |
          for path in public/data/dividend-h30269.json public/data/valuation-h30269.json public/data/china-bond-10y.json; do
            if [[ -f "$path" ]]; then git add -- "$path"; fi
          done
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update valuations and treasury yield"
          git push
      - name: Report incomplete update
        if: steps.update.outcome == 'failure'
        run: exit 1
